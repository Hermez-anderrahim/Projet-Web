{% include 'en_tete.html' %}

<main>
  <div class="entete-page">
    <h1>Ressources pédagogiques</h1>
    <a href="/ajouter-ressource" class="btn btn-primary">Partager un document</a>
  </div>

  {% for r in ressources %}
  <div class="carte-ressource">
    <div>
      <div class="titre">{{ r.titre }}</div>
      <div class="meta">
        <span class="matiere">{{ r.matiere }}</span>
        &nbsp;· partagé par <a href="/utilisateur/{{ r.auteur_id }}">{{ r.auteur }}</a>
      </div>
    </div>
    <a href="{{ r.lien_url }}" target="_blank" class="btn btn-outline">Consulter</a>
  </div>

  {% else %}
  <p class="vide">Aucune ressource partagée. Soyez le premier !</p>
  {% endfor %}

</main>

{% include 'pied_de_page.html' %}
