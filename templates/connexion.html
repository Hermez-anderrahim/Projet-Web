{% include 'en_tete.html' %}

<main>
  <div class="page-connexion">
    <h1>Luminy-Connect</h1>
    <p class="sous-titre">Plateforme d'entraide des étudiants</p>

    {% if erreur %}
    <div class="erreur">{{ erreur }}</div>
    {% endif %}

    <section>
      <h2>Se connecter</h2>
      <form action="/connexion" method="POST">
        <label>
          Nom d'utilisateur
          <input type="text" name="nom_utilisateur" placeholder="Votre identifiant" required>
        </label>
        <label>
          Mot de passe
          <input type="password" name="mot_de_passe" placeholder="••••••••" required>
        </label>
        <button type="submit">Se connecter</button>
      </form>
    </section>

    <section>
      <h2>Créer un compte</h2>
      <form action="/inscription" method="POST">
        <label>
          Nom d'utilisateur
          <input type="text" name="nom_utilisateur" placeholder="Choisissez un identifiant" required>
        </label>
        <label>
          Mot de passe
          <input type="password" name="mot_de_passe" placeholder="Minimum 6 caractères" required>
        </label>
        <label>
          Votre profil
          <select name="est_parrain" required>
            <option value="0">Nouvel arrivant — Filleul (L1)</option>
            <option value="1">Étudiant expérimenté — Parrain (L2/L3)</option>
          </select>
        </label>
        <button type="submit">Créer mon compte</button>
      </form>
    </section>

  </div>
</main>
