{% include 'en_tete.html' %}

<main style="max-width: 1100px;">
  <a href="/" class="lien-retour">← Retour au forum</a>
  <h1>Poser une question</h1>

  <form action="/nouvelle-demande" method="POST">
    <label>
      Matière
      <input type="text" name="matiere" placeholder="ex : Algorithmique, Maths, Web…" required>
    </label>
    <label>
      Description du problème
      <textarea name="description"
                placeholder="Expliquez votre question en détail…"
                required></textarea>
    </label>
    <button type="submit" style="align-self: flex-start; padding: 10px 32px;">
      Publier la demande
    </button>
  </form>
</main>
