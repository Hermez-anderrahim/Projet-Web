{% include 'en_tete.html' %}

<main>
  <a href="/ressources" class="lien-retour">← Retour aux ressources</a>
  <h1>Partager un document</h1>

  <form action="/ajouter-ressource" method="POST">
    <label>
      Matière
      <input type="text" name="matiere" placeholder="ex : Web, Maths, Algorithmique…" required>
    </label>
    <label>
      Titre du document
      <input type="text" name="titre" placeholder="ex : Fiche révision CSS" required>
    </label>
    <label>
      Lien URL
      <input type="url" name="lien_url" placeholder="https://drive.google.com/…" required>
    </label>
    <button type="submit">Ajouter à la bibliothèque</button>
  </form>
</main>
